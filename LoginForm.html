


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hospital Portal | Mobile Ready</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    
    <style>
        :root {
            --green: #0d6e4f;
            --green-light: #1fa67a;
            --blue: #0a3c66;
            --text-soft: #64748b;
            --radius: 16px;
            --bg-gradient: linear-gradient(135deg, #0d6e4f 0%, #0a3c66 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px; 
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tabs */
        .tab-header { display: flex; background: #f8fafc; }
        .tab-btn {
            flex: 1; padding: 20px; border: none; background: transparent;
            font-weight: 700; cursor: pointer; color: var(--text-soft);
            transition: 0.3s; font-size: 1rem;
        }
        .tab-btn.active { 
            background: white; color: var(--green); 
            border-bottom: 3px solid var(--green); 
        }

        .login-content { padding: 30px 25px; }

        .welcome-title { color: var(--blue); font-size: 1.6rem; margin-bottom: 8px; font-family: 'Playfair Display', serif; }
        .welcome-sub { color: var(--text-soft); font-size: 0.85rem; margin-bottom: 25px; }

        /* Role Selection */
        .role-selection { display: flex; gap: 8px; margin-bottom: 20px; }
        .role-option { flex: 1; }
        .role-option input { display: none; }
        .role-box {
            border: 1px solid #e2e8f0; padding: 12px 5px; border-radius: 12px;
            text-align: center; font-size: 0.8rem; font-weight: 600; cursor: pointer;
            transition: 0.2s; color: var(--blue); display: block;
        }
        .role-box i { font-size: 1.1rem; margin-bottom: 5px; display: block; }
        .role-option input:checked + .role-box {
            border-color: var(--green); background: #f0fff4; color: var(--green);
        }

        /* Forms */
        .form-section { display: none; }
        .form-section.active { display: block; }

        .input-group { margin-bottom: 18px; }
        .input-label { display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 8px; color: #334155; }

        .field-container { position: relative; display: flex; align-items: center; }
        .icon-field { position: absolute; left: 16px; color: var(--blue); opacity: 0.7; }

        .field-container input {
            width: 100%; padding: 14px 45px;
            border: 1px solid #e2e8f0; border-radius: 14px; outline: none;
            font-size: 1rem; transition: 0.3s; background: #fcfdfe;
        }
        @media screen and (max-width: 768px) { .field-container input { font-size: 16px; } }

        .field-container input:focus { border-color: var(--green); background: white; box-shadow: 0 0 0 4px rgba(13, 110, 79, 0.1); }

        .toggle-password {
            position: absolute; right: 16px; color: var(--text-soft);
            cursor: pointer; padding: 5px; z-index: 2;
        }

        .btn-submit {
            width: 100%; padding: 16px; background: var(--green);
            color: white; border: none; border-radius: 50px;
            font-weight: 700; cursor: pointer; margin-top: 10px;
            font-size: 1rem; transition: 0.2s;
        }
        .btn-submit:active { transform: scale(0.98); }

        .msg-box {
            display: none; padding: 14px; border-radius: 12px;
            text-align: center; font-weight: 600; margin-bottom: 20px; font-size: 0.9rem;
        }

        .back-home {
            display: block; text-align: center; margin-top: 25px;
            text-decoration: none; color: var(--text-soft); font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="tab-header">
        <button id="tab-signin" class="tab-btn active" onclick="showForm('signin')">Sign In</button>
        <button id="tab-register" class="tab-btn" onclick="showForm('register')">Register</button>
    </div>

    <div class="login-content">
        <div id="statusMsg" class="msg-box"></div>

        <div id="signin-sec" class="form-section active">
            <h2 class="welcome-title">Welcome Back</h2>
            <p class="welcome-sub">Manage your healthcare dashboard</p>
            
            <form id="loginForm">
                <label class="input-label">Select Role</label>
                <div class="role-selection">
                    <label class="role-option">
                        <input type="radio" name="login-role" value="patient" checked>
                        <div class="role-box"><i class="fas fa-user"></i>Patient</div>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="login-role" value="doctor">
                        <div class="role-box"><i class="fas fa-user-md"></i>Doctor</div>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="login-role" value="admin">
                        <div class="role-box"><i class="fas fa-user-shield"></i>Admin</div>
                    </label>
                </div>

                <div class="input-group">
                    <div class="field-container">
                        <i class="fas fa-envelope icon-field"></i>
                        <input type="email" id="lEmail" placeholder="Email Address" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="field-container">
                        <i class="fas fa-lock icon-field"></i>
                        <input type="password" id="lPass" placeholder="Password" required>
                        <i class="fas fa-eye-slash toggle-password" onclick="togglePass('lPass', this)"></i>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Sign In</button>
            </form>
        </div>

        <div id="register-sec" class="form-section">
            <h2 class="welcome-title">New Account</h2>
            <p class="welcome-sub">Join Mahagadhimai Hospital Portal</p>
            
            <form id="registerForm">
                <div class="input-group">
                    <div class="field-container">
                        <i class="fas fa-user icon-field"></i>
                        <input type="text" id="rName" placeholder="Full Name" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="field-container">
                        <i class="fas fa-envelope icon-field"></i>
                        <input type="email" id="rEmail" placeholder="Email Address" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="field-container">
                        <i class="fas fa-lock icon-field"></i>
                        <input type="password" id="rPass" placeholder="Create Password" required>
                        <i class="fas fa-eye-slash toggle-password" onclick="togglePass('rPass', this)"></i>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Create Account</button>
            </form>
        </div>

        <a href="bestweb.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Main Website</a>
    </div>
</div>

<script>
    // 1. Password Visibility
    function togglePass(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            icon.classList.replace("fa-eye-slash", "fa-eye");
        } else {
            input.type = "password";
            icon.classList.replace("fa-eye", "fa-eye-slash");
        }
    }

    // 2. Navigation Logic
    function showForm(type) {
        // Reset status message on switch
        document.getElementById('statusMsg').style.display = 'none';
        
        // Hide all sections, show selected
        document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
        document.getElementById(type + '-sec').classList.add('active');

        // Update Tab Active State
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + type).classList.add('active');
    }

    // 3. Status Message Utility
    function showStatus(text, isError = false) {
        const msg = document.getElementById('statusMsg');
        msg.innerText = text;
        msg.style.display = 'block';
        msg.style.background = isError ? "#fee2e2" : "#dcfce7";
        msg.style.color = isError ? "#b91c1c" : "#15803d";
        msg.style.border = isError ? "1px solid #fecaca" : "1px solid #bbf7d0";
    }

    // 4. Form Submissions (Clean & Corrected)
    document.getElementById('loginForm').onsubmit = function(e) {
        e.preventDefault();
        const email = document.getElementById('lEmail').value.trim();
        const pass = document.getElementById('lPass').value.trim();

        if (email && pass) {
            showStatus("Success! Redirecting to dashboard...");
            setTimeout(() => { window.location.href = "bestweb.html"; }, 1200);
        } else {
            showStatus("Please fill all fields.", true);
        }
    };

    document.getElementById('registerForm').onsubmit = function(e) {
        e.preventDefault();
        const pass = document.getElementById('rPass').value;
        const passRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

        if (!passRegex.test(pass)) {
            showStatus("Password must be 8+ chars with Uppercase, Number, and Symbol.", true);
            return;
        }

        showStatus("Account created! Please Sign In.");
        setTimeout(() => { showForm('signin'); }, 2000);
    };
</script>

</body>
</html>
